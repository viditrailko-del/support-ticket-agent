# Runs everything exactly as it runs locally: inside the dev container, against Postgres from
# docker-compose. Tests never call Gemini (fake LLM), so no secrets are needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: support  # fixed network name (support_default), whatever the repo is called
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only: the committed shop is exactly what the seeded generator produces (the labels depend on it).
      - name: Verify the fake shop snapshot
        run: python -m data.generate_shop --check

      - name: Build dev image
        run: docker compose build api

      - name: Start Postgres
        run: docker compose up -d --wait db

      # Includes the guardrail checks against the 63 human-verified labels and the label review hashes.
      - name: Run tests
        run: docker compose run --rm -T api uv run --frozen pytest -q

      - name: Migrations apply and match the models
        run: |
          docker compose run --rm -T api uv run --frozen alembic upgrade head
          docker compose run --rm -T api uv run --frozen alembic check

      - name: Build production image
        run: docker build -t support-agent-api .

      - name: Production image serves /health with JSON logs only
        run: |
          docker run -d --name prod --network support_default -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://support:support@db:5432/support support-agent-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          docker logs prod 2>&1 | python -c "import json,sys; [json.loads(l) for l in sys.stdin if l.strip()]"

      # What Render runs (render.yaml): the start script on a brand-new database, a postgres:// URL as Neon gives
      # it, then every recorded scenario must end where the eval scored it.
      - name: Demo boots on a fresh database and replays every scenario
        run: |
          docker compose exec -T db psql -U support -d support -c "create database support_demo"
          docker run -d --name demo --network support_default -p 8001:10000 -e PORT=10000 -e DEMO_MODE=true \
            -e DATABASE_URL=postgres://support:support@db:5432/support_demo support-agent-api sh docker/demo-start.sh
          for i in $(seq 1 60); do curl -sf localhost:8001/health && break; sleep 1; done
          curl -sf localhost:8001/ -o /dev/null
          python - <<'EOF'
          import json, pathlib, urllib.request
          for path in sorted(pathlib.Path("app/demo/scenarios").glob("*.json")):
              exp = json.loads(path.read_text(encoding="utf-8"))["expected"]
              req = urllib.request.Request(f"http://localhost:8001/demo/replay/{path.stem}", method="POST")
              t = json.load(urllib.request.urlopen(req))
              got = (t["decision"], sorted(f["code"] for f in t["flags"]))
              assert got == (exp["decision"], sorted(exp["flags"])), (path.stem, got, exp)
              print("ok", path.stem, got)
          EOF

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs db
          docker logs prod || true
          docker logs demo || true
